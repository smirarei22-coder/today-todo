<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="description" content="今日やることをチェックして片付けるシンプルなToDoリスト"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>今日やること</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#202638;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:600px;margin:auto;padding:28px 18px}h1{font-size:27px;margin:0 0 7px}.muted{color:#778094;font-size:14px}.top{display:flex;justify-content:space-between;align-items:flex-start}.count{text-align:right;font-weight:750;font-size:23px}.count small{display:block;font-size:12px;color:#778094;font-weight:400}.track{height:7px;background:#e4e7ef;border-radius:20px;margin:22px 0;overflow:hidden}.fill{height:100%;background:#7477e8;width:0;transition:width .2s}.entry{display:flex;gap:8px;margin-bottom:20px}.entry input{flex:1;min-width:0;background:white;border:1px solid #dce0e9;border-radius:12px;padding:15px;font-size:16px}.entry button{border:0;border-radius:12px;background:#5e63d9;color:white;font-size:24px;width:55px}.panel{background:white;border:1px solid #e5e8f0;border-radius:17px;min-height:150px;padding:5px 16px}.item{display:flex;align-items:center;gap:13px;padding:16px 0;border-bottom:1px solid #edf0f5}.item:last-child{border-bottom:0}.item input{height:23px;width:23px;accent-color:#5e63d9;flex-shrink:0}.name{flex:1;overflow-wrap:anywhere;font-size:16px}.done .name{text-decoration:line-through;color:#a1a6b2}.remove{border:0;background:none;color:#9ca3b4;font-size:24px;padding:3px 8px}.empty{text-align:center;padding:45px 0;color:#9ba3b3;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.footer button{border:0;background:none;color:#747b8d;text-decoration:underline;font-size:13px;padding:6px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a5a8ff;outline-offset:2px}@media(prefers-color-scheme:dark){:root{background:#131723;color:#f4f5fa}.muted,.count small{color:#a4acc0}.panel,.entry input{background:#202638;color:#fff;border-color:#3a4152}.item{border-color:#353b4c}.track{background:#343b4e}.empty{color:#a4acc0}.footer button{color:#c0c6d6}}
</style></head><body><main><div class="top"><div><h1>☀️ 今日やること</h1><div class="muted" id="date"></div></div><div class="count"><span id="counter">0 / 0</span><small>完了</small></div></div><div class="track"><div class="fill" id="fill"></div></div><form class="entry" id="form"><input id="new" required maxlength="120" aria-label="今日やること" placeholder="今日やることを入力..." autocomplete="off"><button type="submit" aria-label="追加">＋</button></form><section class="panel" aria-label="今日のタスク"><div id="list"></div><div class="empty" id="empty">＋ から今日やることを追加しよう！</div></section><div class="footer"><span class="muted" id="remaining">残り 0 件</span><button type="button" id="clear">完了した項目を削除</button></div></main><script src="./app.js" defer></script></body></html>
